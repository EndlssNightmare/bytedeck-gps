<title>ByteDeck GPS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0e14;
    --surface: #131820;
    --border: #1e2630;
    --fg: #c5cdd8;
    --fg-dim: #5c6773;
    --accent: #00e8c6;
    --accent-dim: rgba(0, 232, 198, 0.12);
    --red: #ff3333;
    --red-dim: rgba(255, 51, 51, 0.12);
    --yellow: #ffb454;
    --yellow-dim: rgba(255, 180, 84, 0.12);
    --green: #c2d94c;
    color-scheme: dark;
  }
  /* Single dark-first theme — this is a hardware companion app, dark-only by design */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    text-align: center;
    padding: 1.5rem 0 1rem;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-family: monospace;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-wrap: balance;
  }
  .header p {
    font-size: 0.8rem;
    color: var(--fg-dim);
    margin-top: 0.3rem;
  }

  .status-bar {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    padding: 0.75rem 0;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-family: monospace;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--fg-dim);
  }
  .chip.ok .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .chip.warn .dot { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .chip.err .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .connect-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem 0;
  }

  .btn {
    font-family: monospace;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.75rem 2rem;
    border: 2px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-dim);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .btn:active { background: var(--accent); color: var(--bg); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn.danger { border-color: var(--red); background: var(--red-dim); color: var(--red); }
  .btn.danger:active { background: var(--red); color: var(--bg); }

  .data-panel {
    display: none;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    flex: 1;
  }
  .data-panel.active { display: flex; flex-direction: column; gap: 0.5rem; padding-bottom: 1rem; }

  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.65rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .data-row .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fg-dim);
    font-family: monospace;
  }
  .data-row .value {
    font-size: 0.95rem;
    font-family: monospace;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .log {
    margin-top: auto;
    max-height: 120px;
    overflow-y: auto;
    padding: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.65rem;
    color: var(--fg-dim);
    line-height: 1.6;
    width: 100%;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }
  .log .ok { color: var(--accent); }
  .log .err { color: var(--red); }
  .log .warn { color: var(--yellow); }

  .send-counter {
    text-align: center;
    font-size: 0.7rem;
    color: var(--fg-dim);
    font-family: monospace;
    padding: 0.5rem 0;
  }
  .send-counter span { color: var(--accent); font-weight: 600; }

  .interval-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 0;
  }
  .interval-control label {
    font-size: 0.7rem;
    color: var(--fg-dim);
    font-family: monospace;
  }
  .interval-control select {
    font-family: monospace;
    font-size: 0.75rem;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.5rem;
  }
</style>

<div class="header">
  <h1>&gt; BYTEDECK COMPANION</h1>
  <p>Envia GPS + hora do celular para o ESP32 via BLE</p>
</div>

<div class="status-bar">
  <div class="chip" id="chipBle"><span class="dot"></span>BLE</div>
  <div class="chip" id="chipGps"><span class="dot"></span>GPS</div>
  <div class="chip" id="chipSend"><span class="dot"></span>TX</div>
</div>

<div class="connect-section" id="connectSection">
  <button class="btn" id="btnConnect" onclick="connectBLE()">CONECTAR</button>
  <p style="font-size:0.75rem; color:var(--fg-dim); text-align:center; max-width:300px;">
    Abra no <strong style="color:var(--fg)">Chrome Android</strong>. ESP32 precisa estar ligado.<br>
    <strong style="color:var(--red)">NAO pareie pelo Bluetooth do celular!</strong><br>
    Use APENAS este botao pra conectar.
  </p>
</div>

<div class="data-panel" id="dataPanel">
  <div class="data-row"><span class="label">LAT</span><span class="value" id="vLat">--</span></div>
  <div class="data-row"><span class="label">LNG</span><span class="value" id="vLng">--</span></div>
  <div class="data-row"><span class="label">SPEED</span><span class="value" id="vSpd">-- km/h</span></div>
  <div class="data-row"><span class="label">HEADING</span><span class="value" id="vHdg">--°</span></div>
  <div class="data-row"><span class="label">HORA</span><span class="value" id="vTime">--:--:--</span></div>

  <div class="interval-control">
    <label>Intervalo TX:</label>
    <select id="selInterval" onchange="updateInterval()">
      <option value="1000">1s</option>
      <option value="2000" selected>2s</option>
      <option value="5000">5s</option>
    </select>
  </div>

  <div class="send-counter">Pacotes enviados: <span id="txCount">0</span></div>

  <button class="btn danger" onclick="disconnectBLE()" style="align-self:center;">DESCONECTAR</button>

  <div class="log" id="log"></div>
</div>

<script>
const SVC_UUID  = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

let device = null, characteristic = null, gpsWatchId = null, sendTimer = null;
let txCount = 0, sendInterval = 2000;
let lastPos = { lat: 0, lng: 0, spd: 0, hdg: 0 };

const $ = id => document.getElementById(id);

function log(msg, cls = '') {
  const el = $('log');
  const t = new Date().toLocaleTimeString('pt-BR');
  el.innerHTML += `<div class="${cls}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setChip(id, state) {
  const el = $(id);
  el.className = 'chip ' + state;
}

async function connectBLE() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth nao suportado. Use Chrome Android.', 'err');
    return;
  }

  try {
    $('btnConnect').disabled = true;
    log('Escaneando dispositivos BLE...');

    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'ByteDeck' }],
      optionalServices: [SVC_UUID]
    });

    log('ByteDeck encontrado! Conectando...', 'ok');
    device.addEventListener('gattserverdisconnected', onDisconnect);

    const server = await device.gatt.connect();
    log('GATT conectado, buscando servico...', 'ok');
    const svc = await server.getPrimaryService(SVC_UUID);
    log('Servico encontrado, buscando caracteristica...', 'ok');
    characteristic = await svc.getCharacteristic(CHAR_UUID);

    setChip('chipBle', 'ok');
    log('BLE pronto! Enviando dados...', 'ok');

    startGPS();
    startSending();

    $('connectSection').style.display = 'none';
    $('dataPanel').classList.add('active');
  } catch (e) {
    log('Erro: ' + e.message, 'err');
    $('btnConnect').disabled = false;
    setChip('chipBle', 'err');
  }
}

function onDisconnect() {
  log('BLE desconectado', 'warn');
  setChip('chipBle', 'err');
  setChip('chipSend', '');
  stopSending();
  stopGPS();
  characteristic = null;
  $('connectSection').style.display = '';
  $('dataPanel').classList.remove('active');
  $('btnConnect').disabled = false;
}

function disconnectBLE() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

function startGPS() {
  if (!navigator.geolocation) {
    log('Geolocation nao disponivel', 'err');
    setChip('chipGps', 'err');
    return;
  }

  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      lastPos.lat = pos.coords.latitude;
      lastPos.lng = pos.coords.longitude;
      lastPos.spd = (pos.coords.speed || 0) * 3.6;
      lastPos.hdg = pos.coords.heading || 0;

      $('vLat').textContent = lastPos.lat.toFixed(6);
      $('vLng').textContent = lastPos.lng.toFixed(6);
      $('vSpd').textContent = lastPos.spd.toFixed(1) + ' km/h';
      $('vHdg').textContent = lastPos.hdg.toFixed(0) + '°';

      setChip('chipGps', 'ok');
    },
    err => {
      log('GPS erro: ' + err.message, 'err');
      setChip('chipGps', 'err');
    },
    { enableHighAccuracy: true, maximumAge: 2000 }
  );
  log('GPS ativado (high accuracy)', 'ok');
}

function stopGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  setChip('chipGps', '');
}

function startSending() {
  sendTimer = setInterval(sendData, sendInterval);
}

function stopSending() {
  if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
}

function updateInterval() {
  sendInterval = parseInt($('selInterval').value);
  if (sendTimer) { stopSending(); startSending(); }
}

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function sendData() {
  if (!characteristic) return;

  const now = new Date();
  $('vTime').textContent = now.toLocaleTimeString('pt-BR');

  const payload = JSON.stringify({
    lat: parseFloat(lastPos.lat.toFixed(6)),
    lng: parseFloat(lastPos.lng.toFixed(6)),
    spd: parseFloat(lastPos.spd.toFixed(1)),
    hdg: parseFloat(lastPos.hdg.toFixed(0)),
    ts: Math.floor(Date.now() / 1000)
  });

  try {
    const enc = new TextEncoder().encode(payload);
    await characteristic.writeValueWithResponse(enc);
    log('TX: ' + payload.substring(0, 50) + '...', 'ok');
    txCount++;
    $('txCount').textContent = txCount;
    setChip('chipSend', 'ok');
    setTimeout(() => setChip('chipSend', ''), 300);
  } catch (e) {
    log('TX erro: ' + e.message, 'err');
    setChip('chipSend', 'err');
  }
}
</script>
